kind: Deployment
apiVersion: apps/v1
metadata:
  name: landuseplanning-api-mongodb-dev
  namespace: e8b9ad-dev
  labels:
    app: landuseplanning-api-mongodb-dev
    app.kubernetes.io/component: landuseplanning-api-mongodb-dev
    app.kubernetes.io/instance: landuseplanning-api-mongodb-dev
    app.kubernetes.io/part-of: landuseplanning-api-dev
    app.openshift.io/runtime-namespace: openshift
    app.openshift.io/runtime-version: latest
spec:
  strategy:
    type: RollingUpdate
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: landuseplanning-api-mongodb-dev
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: landuseplanning-api-mongodb-dev
        deploymentconfig: landuseplanning-api-mongodb-dev
      annotations:
        openshift.io/generated-by: OpenShiftWebConsole
    spec:
      volumes:
        - name: landuseplanning-api-mongodb-dev
          persistentVolumeClaim:
            claimName: landuseplanning-api-mongodb-dev
      containers:
        - resources: {}
          terminationMessagePath: /dev/termination-log
          name: landuseplanning-api-mongodb-dev
          env:
            - name: MONGODB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: landuseplanning-api-mongodb-dev
                  key: database-name
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: landuseplanning-api-mongodb-dev
                  key: database-user
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: landuseplanning-api-mongodb-dev
                  key: database-password
            - name: MONGODB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: landuseplanning-api-mongodb-dev
                  key: database-admin-password
          ports:
            - containerPort: 27017
              protocol: TCP
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: landuseplanning-api-mongodb-dev
              mountPath: /var/lib/mongodb/data
          terminationMessagePolicy: File
          image: 'image-registry.apps.silver.devops.gov.bc.ca/openshift/mongodb'
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
