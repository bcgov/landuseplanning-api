kind: Deployment
apiVersion: apps/v1
metadata:
  name: landuseplanning-api-test
  namespace: e8b9ad-test
  labels:
    app: landuseplanning-api-test
    app.kubernetes.io/component: landuseplanning-api-test
    app.kubernetes.io/instance: landuseplanning-api-test
    app.kubernetes.io/part-of: landuseplanning-api-test
spec:
  strategy:
    type: RollingUpdate
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: landuseplanning-api-test
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: landuseplanning-api-test
    spec:
      containers:
        - name: landuseplanning-api-test
          image: image-registry.apps.silver.devops.gov.bc.ca/e8b9ad-tools/landuseplanning-api:test
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: KEYCLOAK_ENABLED
              value: 'true'
            - name: MONGODB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: landuseplanning-api-mongodb-test
                  key: database-name
            - name: MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: landuseplanning-api-mongodb-test
                  key: database-user
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: landuseplanning-api-mongodb-test
                  key: database-password
            - name: MONGODB_SERVICE_HOST
              value: landuseplanning-api-mongodb-test
            - name: MINIO_HOST
              valueFrom:
                secretKeyRef:
                  name: landuseplanning-api-minio-test
                  key: minio-host
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: landuseplanning-api-minio-test
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: landuseplanning-api-minio-test
                  key: minio-secret-key
            - name: CHES_AUTH_ENDPOINT
              value: 'https://test.loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token'
            - name: _EMAIL_CLIENTID
              valueFrom:
                secretKeyRef:
                  name: landuseplanning-api-email-test
                  key: email-client-id
            - name: _EMAIL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: landuseplanning-api-email-test
                  key: email-client-secret
            - name: CHES_ENDPOINT
              value: 'https://ches-test.api.gov.bc.ca/'
            - name: SSO_ISSUER
              value: 'https://test.loginproxy.gov.bc.ca/auth/realms/standard'
            - name: SSO_JWKSURI
              value: 'https://test.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/certs'
            - name: CLAMAV_SERVICE_HOST
              value: lup-clamav.e8b9ad-tools.svc.cluster.local
            - name: CLAMAV_SERVICE_PORT
              value: '3310'
            - name: ENABLE_VIRUS_SCANNING
              value: 'true'
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
