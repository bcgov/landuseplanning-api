kind: Service
apiVersion: v1
metadata:
  name: landuseplanning-api-mongodb-test
  namespace: e8b9ad-test
  labels:
    app: landuseplanning-api-mongodb-test
    app.kubernetes.io/component: landuseplanning-api-mongodb-test
    app.kubernetes.io/instance: landuseplanning-api-mongodb-test
    app.kubernetes.io/part-of: landuseplanning-api-test
  annotations:
    template.openshift.io/expose-uri: 'mongodb://{.spec.clusterIP}:{.spec.ports[?(.name=="mongo")].port}'
spec:
  clusterIP: 10.98.21.84
  ipFamilies:
    - IPv4
  ports:
    - name: mongo
      protocol: TCP
      port: 27017
      targetPort: 27017
  internalTrafficPolicy: Cluster
  clusterIPs:
    - 10.98.21.84
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
  selector:
    app: landuseplanning-api-mongodb-test