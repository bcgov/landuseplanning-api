kind: Deployment
apiVersion: apps/v1
metadata:
  annotations:
    deployment.kubernetes.io/revision: '9'
  name: landuseplanning-api-mongodb6-dev
  namespace: e8b9ad-dev
  labels:
    app: landuseplanning-api-mongodb6-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landuseplanning-api-mongodb6-dev
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: landuseplanning-api-mongodb6-dev
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: landuseplanning-api-mongodb-6-dev
      containers:
        - resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          name: mongodb
          command:
            - mongod
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            timeoutSeconds: 1
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 3
          env:
            - name: MONGODB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: landuseplanning-api-mongodb-dev
                  key: database-name
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: landuseplanning-api-mongodb-dev
                  key: database-user
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: landuseplanning-api-mongodb-dev
                  key: database-password
            - name: MONGODB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: landuseplanning-api-mongodb-dev
                  key: database-admin-password
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: data
              mountPath: /data/db
          terminationMessagePolicy: File
          image: 'mongo:6.0.13'
          args:
            - '--bind_ip'
            - 0.0.0.0
            - '--dbpath'
            - /data/db
            - '--auth'
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
